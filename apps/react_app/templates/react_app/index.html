{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joseph Prince - Full Stack Developer &amp; Consultant specializing in Django, React, and AI integration." />
    <title>Joseph Prince | Full Stack Developer</title>
    <link rel="canonical" href="https://www.thejosephprince.com/" />

    <!-- Open Graph / Twitter. Without these, every link shared to LinkedIn,
         Slack or X renders as a bare grey rectangle. og:image must be an
         absolute URL - the static tag resolves to the CDN origin in production. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joseph Prince" />
    <meta property="og:url" content="https://www.thejosephprince.com/" />
    <meta property="og:title" content="Joseph Prince | Full Stack Developer &amp; CTO" />
    <meta property="og:description" content="Production systems and architecture - Django, React and cloud platforms built to survive years of production traffic." />
    <meta property="og:image" content="{% static 'react_app/og-card.png' %}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joseph Prince - Full Stack Developer and CTO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joseph Prince | Full Stack Developer &amp; CTO" />
    <meta name="twitter:description" content="Production systems and architecture - Django, React and cloud platforms built to survive years of production traffic." />
    <meta name="twitter:image" content="{% static 'react_app/og-card.png' %}" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'react_app/assets/JPrince.png' %}" />

    <!-- Font preloads - fetch Latin subset woff2 files before CSS/JS is parsed
         so the browser has the fonts ready before text layout begins, preventing FOUT.
         crossorigin="anonymous" is required by the font preload spec even for same-origin. -->
    <link rel="preload" href="{% static 'react_app/assets/inter-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/inter-latin-500-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/inter-latin-600-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/orbitron-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/orbitron-latin-500-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/orbitron-latin-700-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="{% static 'react_app/assets/orbitron-latin-900-normal.woff2' %}" as="font" type="font/woff2" crossorigin="anonymous">

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Joseph Prince",
      "jobTitle": "Full Stack Developer & Consultant",
      "description": "Full Stack Developer and Consultant specializing in Django, React, and AI integration.",
      "sameAs": [
        "https://linkedin.com/in/thejprince",
        "https://github.com/dedrozs"
      ]
    }
    </script>

    <link rel="stylesheet" href="{% static 'react_app/index.css' %}">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="{% static 'react_app/index.js' %}"></script>
  </body>
</html>
