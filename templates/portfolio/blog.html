{% extends "global/base.html" %}
{% load static %}

{% block content %}
<!-- Blog List Section -->
<section class="py-20 bg-gray-100 dark:bg-gray-900">
    <div class="max-w-7xl mx-auto px-6">
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white text-center opacity-0" id="blog-title">
            My Blog
        </h1>
        <p class="text-lg text-gray-600 dark:text-gray-300 text-center mt-2 opacity-0" id="blog-subtext">
            Exploring technology, AI, and full-stack development insights.
        </p>

        <!-- Blog Grid -->
        <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for blog in blogs %}
            <div class="blog-card opacity-0">
                <div class="rounded-lg shadow-lg overflow-hidden">
                    <img src="{{ blog.image.url }}" alt="{{ blog.title }}" class="w-full">
                </div>
                <h3 class="text-xl font-semibold mt-4 text-gray-900 dark:text-white">
                    {{ blog.title }}
                </h3>
                <p class="text-gray-500 dark:text-gray-300 mt-2">
                    {{ blog.content|truncatewords:20 }}
                </p>
                <div class="mt-4">
                    <a href="{% url 'blog_detail' blog.id %}" class="btn-primary">📖 Read More</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Anime.js Animations -->
<script>
    anime.timeline({ easing: 'easeOutExpo' })
        .add({
            targets: "#blog-title",
            opacity: [0, 1],
            translateY: [-20, 0],
            duration: 1000
        })
        .add({
            targets: "#blog-subtext",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 800
        }, "-=500")
        .add({
            targets: ".blog-card",
            opacity: [0, 1],
            translateY: [20, 0],
            duration: 800,
            delay: anime.stagger(200)
        });
</script>

{% endblock %}
