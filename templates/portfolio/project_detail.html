{% extends "global/base.html" %}
{% load static %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-4xl mx-auto px-6">
        <!-- Project Title -->
        <h1 class="text-4xl font-bold text-gray-900 text-center">{{ project.title }}</h1>

        <!-- Project Image -->
        <div class="mt-6 flex justify-center">
            <img src="{{ project.image.url }}" alt="{{ project.title }}" class="w-full max-w-2xl rounded-lg shadow-lg">
        </div>

        <!-- Project Details -->
        <div class="mt-10 space-y-6 text-gray-700 text-lg leading-relaxed">
            <p>{{ project.description }}</p>
            <p><strong>Technologies:</strong> {{ project.technologies }}</p>

            <div class="mt-6 flex space-x-4">
                {% if project.github_link %}
                <a href="{{ project.github_link }}" target="_blank" 
                   class="px-6 py-3 bg-gray-700 text-white rounded-lg shadow hover:bg-gray-800 transition">
                    View on GitHub
                </a>
                {% endif %}
                
                {% if project.live_demo %}
                <a href="{{ project.live_demo }}" target="_blank" 
                   class="px-6 py-3 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition">
                    Live Demo
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
