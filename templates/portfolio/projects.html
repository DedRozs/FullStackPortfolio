{% extends 'global/base.html' %}

{% block title %}Joseph Prince - Projects{% endblock %}

{% block content %}
<section class="hero text-center">
    <div class="container">
        <h1 class="display-3 fw-bold glitch">🚀 My Creations</h1>
        <p class="lead">Innovative solutions built with AI, Automation, and futuristic tech.</p>
    </div>
</section>

<section class="container my-5">
    <h2 class="text-center text-neon">Highlighted Projects 🛠️</h2>
    <div class="row g-4" id="projects-container">
        <!-- Projects will be loaded dynamically here -->
    </div>
</section>

<section class="container text-center my-5">
    <h2 class="text-neon">Connect With Me 🌐</h2>
    <a href="https://github.com/yourprofile" class="btn btn-outline-light btn-lg m-2">GitHub</a>
    <a href="https://linkedin.com/in/yourprofile" class="btn btn-outline-light btn-lg m-2">LinkedIn</a>
    <a href="/contact/" class="btn btn-primary btn-lg m-2">Let's Talk</a>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("/api/projects/")
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById("projects-container");
            container.innerHTML = "";
            data.forEach(project => {
                container.innerHTML += `
                    <div class="col-md-4">
                        <div class="card project-card">
                            <img src="${project.image || '/static/images/default-project.jpg'}" class="card-img-top" alt="${project.title}">
                            <div class="card-body">
                                <h5 class="card-title fw-bold">${project.title}</h5>
                                <p class="card-text">${project.description.substring(0, 100)}...</p>
                                <a href="/projects/${project.id}/" class="btn btn-primary">View Details</a>
                                <a href="${project.github_link}" class="btn btn-outline-light">GitHub</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        })
        .catch(error => console.error("Error fetching projects:", error));
});
</script>

{% endblock %}
