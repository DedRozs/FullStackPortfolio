{% extends "global/base.html" %}
{% load static %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-4xl mx-auto px-6">
        <!-- Blog Title -->
        <h1 class="text-4xl font-bold text-gray-900">{{ blog.title }}</h1>
        <p class="mt-4 text-gray-500">Published on {{ blog.created_at|date:"F d, Y" }}</p>

        <!-- Blog Image -->
        <div class="mt-6 flex justify-center">
            <img src="{{ blog.image.url }}" alt="{{ blog.title }}" class="w-full max-w-2xl rounded-lg shadow-lg">
        </div>

        <!-- Blog Content -->
        <article class="mt-10 space-y-6 text-lg leading-relaxed text-gray-700">
            <p>{{ blog.content|linebreaks }}</p>
        </article>

        <!-- Back Button -->
        <div class="mt-10">
            <a href="{% url 'blog' %}" class="px-6 py-3 bg-gray-700 text-white rounded-lg shadow hover:bg-gray-800 transition">
                ← Back to Blog
            </a>
        </div>
    </div>
</section>
{% endblock %}
