{% extends "global/base.html" %}
{% load static %}

{% block content %}
<section class="py-16 bg-white">
    <div class="max-w-4xl mx-auto px-6">
        <h1 class="text-4xl font-bold text-gray-900 text-center">Contact Me</h1>
        <p class="mt-4 text-lg text-gray-600 text-center">
            Feel free to reach out for collaborations, project inquiries, or just to say hello!
        </p>

        <!-- Contact Form -->
        <form method="post" class="mt-10 bg-gray-100 p-6 rounded-lg shadow-md max-w-lg mx-auto space-y-4">
            {% csrf_token %}

            <!-- Name Field -->
            <div>
                <label for="name" class="block text-gray-700 font-semibold">Name</label>
                <input type="text" id="name" name="name" required 
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-gray-700 font-semibold">Email</label>
                <input type="email" id="email" name="email" required 
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Message Field -->
            <div>
                <label for="message" class="block text-gray-700 font-semibold">Message</label>
                <textarea id="message" name="message" rows="5" required 
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="mt-6">
                <button type="submit" 
                    class="w-full px-6 py-3 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
