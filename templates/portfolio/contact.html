{% extends "global/base.html" %}
{% load static %}

{% block content %}
<!-- Contact Section -->
<section class="py-20 bg-gray-100 dark:bg-gray-900">
    <div class="max-w-4xl mx-auto px-6 text-center">
        <h1 id="contact-title" class="text-4xl font-bold text-gray-900 dark:text-white opacity-0">
            Get in Touch
        </h1>
        <p id="contact-subtext" class="text-lg text-gray-600 dark:text-gray-300 mt-2 opacity-0">
            Have a project or an opportunity? Let’s connect.
        </p>

        <!-- Contact Form -->
        <form id="contact-form" method="post" class="mt-10 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg opacity-0">
            {% csrf_token %}
            <div class="mb-4">
                <label for="name" class="block text-gray-700 dark:text-gray-200 text-sm font-semibold">Your Name</label>
                <input type="text" id="name" name="name" class="w-full p-3 rounded-lg border dark:border-gray-700 focus:ring focus:ring-blue-300 dark:focus:ring-blue-600">
            </div>

            <div class="mb-4">
                <label for="email" class="block text-gray-700 dark:text-gray-200 text-sm font-semibold">Your Email</label>
                <input type="email" id="email" name="email" class="w-full p-3 rounded-lg border dark:border-gray-700 focus:ring focus:ring-blue-300 dark:focus:ring-blue-600">
            </div>

            <div class="mb-4">
                <label for="message" class="block text-gray-700 dark:text-gray-200 text-sm font-semibold">Your Message</label>
                <textarea id="message" name="message" rows="4" class="w-full p-3 rounded-lg border dark:border-gray-700 focus:ring focus:ring-blue-300 dark:focus:ring-blue-600"></textarea>
            </div>

            <button type="submit" class="btn-primary w-full">
                📩 Send Message
            </button>
        </form>

        <!-- Alternative Contact Methods -->
        <div id="contact-links" class="mt-8 opacity-0">
            <p class="text-gray-600 dark:text-gray-400">Or reach me via:</p>
            <div class="flex justify-center space-x-6 mt-4">
                <a href="mailto:your.email@example.com" class="text-blue-500 dark:text-blue-300 hover:underline">📧 Email</a>
                <a href="https://linkedin.com/in/yourprofile" class="text-blue-500 dark:text-blue-300 hover:underline">🔗 LinkedIn</a>
                <a href="https://github.com/yourprofile" class="text-blue-500 dark:text-blue-300 hover:underline">💻 GitHub</a>
            </div>
        </div>
    </div>
</section>

<!-- Anime.js Animations -->
<script>
    // Contact Page Animations
    anime.timeline({ easing: 'easeOutExpo' })
        .add({
            targets: "#contact-title",
            opacity: [0, 1],
            translateY: [-20, 0],
            duration: 1000
        })
        .add({
            targets: "#contact-subtext",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 800
        }, "-=500")
        .add({
            targets: "#contact-form",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 1000
        }, "-=400")
        .add({
            targets: "#contact-links",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 600
        }, "-=300");

    // Simple Form Validation
    document.getElementById("contact-form").addEventListener("submit", function(event) {
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let message = document.getElementById("message").value.trim();

        if (name === "" || email === "" || message === "") {
            event.preventDefault();
            alert("❌ Please fill in all fields before submitting.");
        }
    });
</script>

{% endblock %}
