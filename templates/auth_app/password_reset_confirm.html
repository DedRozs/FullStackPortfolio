{% extends "global/base.html" %}
{% block content %}
<section class="py-20 text-center">
    <h1 class="text-3xl font-bold">🔒 Set a New Password</h1>
    <form method="post" class="mt-6">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_new_password1" class="block text-gray-700 text-sm font-semibold">New Password</label>
            {{ form.new_password1 }}
        </div>
        <div class="mb-4">
            <label for="id_new_password2" class="block text-gray-700 text-sm font-semibold">Confirm Password</label>
            {{ form.new_password2 }}
        </div>
        <button type="submit" class="btn-primary w-full">✅ Reset Password</button>
    </form>
</section>
{% endblock %}
