{% extends "global/base.html" %}
{% load static %}

{% block content %}
<section class="py-20 bg-gray-100 dark:bg-gray-900 flex justify-center items-center">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg max-w-md w-full opacity-0" id="reset-box">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white text-center opacity-0" id="reset-title">
            Reset Your Password
        </h1>
        <p class="mt-2 text-gray-600 dark:text-gray-300 text-center opacity-0" id="reset-subtext">
            Enter your email to receive a password reset link.
        </p>

        <form method="post" class="mt-6 opacity-0" id="reset-form">
            {% csrf_token %}
            <div class="mb-4">
                <label for="id_email" class="block text-gray-700 dark:text-gray-200 text-sm font-semibold">Email</label>
                <input type="email" id="id_email" name="email" required class="w-full p-3 rounded-lg border dark:border-gray-700 focus:ring focus:ring-blue-300 dark:focus:ring-blue-600">
            </div>

            <button type="submit" class="btn-primary w-full">
                📩 Send Reset Link
            </button>
        </form>

        <div class="mt-6 text-center opacity-0" id="reset-links">
            <a href="{% url 'login' %}" class="text-blue-500 dark:text-blue-300 hover:underline">Back to Login</a>
        </div>
    </div>
</section>

<script>
    anime.timeline({ easing: 'easeOutExpo' })
        .add({
            targets: "#reset-box",
            opacity: [0, 1],
            translateY: [-20, 0],
            duration: 1000
        })
        .add({
            targets: "#reset-title",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 800
        }, "-=500")
        .add({
            targets: "#reset-subtext",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 800
        }, "-=500")
        .add({
            targets: "#reset-form",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 1000
        }, "-=400")
        .add({
            targets: "#reset-links",
            opacity: [0, 1],
            translateY: [-10, 0],
            duration: 600
        }, "-=300");
</script>
{% endblock %}
