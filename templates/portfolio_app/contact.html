{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-10 text-center">
    <h2 class="text-4xl font-bold text-white">Contact Me</h2>
    <p class="text-gray-300 mt-3">Let's collaborate! Reach out to me at:</p>
    <p class="text-blue-400 text-lg mt-2">
        <a href="mailto:your@email.com" class="hover:underline">your@email.com</a>
    </p>

    <form class="mt-5 max-w-lg mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
        <label class="block text-white mb-2">Your Name</label>
        <input type="text" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white" placeholder="John Doe">

        <label class="block text-white mt-4 mb-2">Your Email</label>
        <input type="email" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white" placeholder="email@example.com">

        <label class="block text-white mt-4 mb-2">Message</label>
        <textarea class="w-full px-4 py-2 rounded-lg bg-gray-700 text-white" rows="4"
            placeholder="Write your message..."></textarea>

        <button type="submit"
            class="mt-5 px-6 py-3 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-500">
            Send Message
        </button>
    </form>
</div>

<script>
    anime({
        targets: 'form',
        opacity: [0, 1],
        translateY: [20, 0],
        duration: 1000,
        easing: 'easeOutQuad'
    });
</script>
{% endblock %}
