{% extends 'base.html' %}

{% block content %}
<!-- Hero Section -->
<div class="flex flex-col items-center justify-center h-screen bg-gray-900 text-white">
    <h1 id="hero-title" class="text-5xl font-bold text-blue-400 opacity-0">
        Welcome to My AI Portfolio
    </h1>
    <p id="hero-subtitle" class="text-gray-300 mt-2 opacity-0">
        Showcasing AI-powered full-stack projects
    </p>
    <div class="mt-5">
        <a href="{% url 'projects' %}" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-500 transition duration-300">
            View Projects
        </a>
        <a href="{% url 'about' %}" class="ml-4 px-6 py-3 bg-gray-700 text-white font-semibold rounded-md hover:bg-gray-600 transition duration-300">
            About Me
        </a>
        <a href="{% url 'contact' %}" class="ml-4 px-6 py-3 bg-gray-700 text-white font-semibold rounded-md hover:bg-gray-600 transition duration-300">
            Contact Me
        </a>
    </div>
</div>

<script>
    anime({
        targets: '#hero-title',
        translateY: [-50, 0],
        opacity: [0, 1],
        duration: 1000,
        easing: 'easeOutExpo'
    });

    anime({
        targets: '#hero-subtitle',
        translateY: [-30, 0],
        opacity: [0, 1],
        duration: 1200,
        easing: 'easeOutExpo',
        delay: 200
    });

    anime({
        targets: 'a',
        translateY: [20, 0],
        opacity: [0, 1],
        duration: 1500,
        easing: 'easeOutExpo',
        delay: anime.stagger(200)
    });
</script>
{% endblock %}
