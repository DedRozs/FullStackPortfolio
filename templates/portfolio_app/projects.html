{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-10">
    <h2 class="text-3xl font-bold text-white text-center mb-10">Projects</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for project in projects %}
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg transform hover:scale-105 transition duration-300 ease-in-out fade-in">
            <h3 class="text-xl font-bold text-blue-400">{{ project.title }}</h3>
            <p class="text-gray-300">{{ project.description }}</p>
            <a href="{{ project.github_link }}" target="_blank"
                class="text-blue-400 hover:underline mt-3 inline-block">
                View Code →
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        anime({
            targets: '.fade-in',
            opacity: [0, 1],
            translateY: [20, 0],
            duration: 1000,
            easing: 'easeOutQuad',
            delay: anime.stagger(200)
        });
    });
</script>
{% endblock %}
