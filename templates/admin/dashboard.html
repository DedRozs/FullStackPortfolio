{% extends 'global/base.html' %}
{% block content %}
<div class="container">
    <h1 class="text-center">Admin Dashboard</h1>
    <p>Manage projects and users here.</p>
    <div id="admin-projects-container"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const token = localStorage.getItem("authToken");

    if (!token) {
        window.location.href = "/login/";
    } else {
        fetch("/api/auth/me/", {
            method: "GET",
            headers: { "Authorization": "Token " + token }
        })
        .then(response => response.json())
        .then(user => {
            if (user.role !== "admin") {
                window.location.href = "/";
            } else {
                fetch("/api/projects/", {
                    headers: { "Authorization": "Token " + token }
                })
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("admin-projects-container");
                    data.forEach(project => {
                        container.innerHTML += `
                            <div>
                                <h5>${project.title}</h5>
                                <button onclick="deleteProject(${project.id})" class="btn btn-danger">Delete</button>
                            </div>
                        `;
                    });
                });
            }
        })
        .catch(error => console.error("Access denied:", error));
    }
});

function deleteProject(projectId) {
    const token = localStorage.getItem("authToken");
    fetch(`/api/projects/${projectId}/`, {
        method: "DELETE",
        headers: { "Authorization": "Token " + token }
    })
    .then(response => {
        if (response.ok) {
            window.location.reload();
        } else {
            alert("Failed to delete project.");
        }
    });
}
</script>
{% endblock %}
