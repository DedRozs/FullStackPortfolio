</head>
<nav class="bg-black bg-opacity-90 fixed w-full z-50 top-0 shadow-md" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <!-- Logo -->
            <div class="flex items-center">
                <a class="text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-400" href="/">
                    Joseph Prince
                </a>
            </div>
            <!-- Desktop Menu -->
            <div class="hidden md:flex space-x-6" role="menu">
                <a class="text-white hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400" href="/"
                    role="menuitem">Home</a>
                <a class="text-white hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    href="/about" role="menuitem">About</a>
                <a class="text-white hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    href="/projects" role="menuitem">Projects</a>
                <a class="text-white hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
                    href="/contact" role="menuitem">Contact</a>
            </div>
            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button aria-controls="mobile-menu" aria-expanded="false" aria-label="Open mobile menu"
                    class="text-white focus:outline-none focus:ring-2 focus:ring-blue-400" id="mobile-menu-btn">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round"

<script>
    // Mobile Menu Toggle
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    menuBtn.addEventListener('click', function () {
        const isExpanded = menuBtn.getAttribute('aria-expanded') === 'true';
        menuBtn.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.classList.toggle('hidden');
    });
</script>
