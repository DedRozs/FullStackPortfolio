<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Joseph Prince's portfolio. A Full-Stack Developer specializing in modern web experiences.">
    <meta name="keywords" content="Full-Stack Developer, Web Developer, JavaScript, Python, TailwindCSS, Portfolio">
    <meta name="author" content="Joseph Prince">
    
    <!-- Open Graph Meta Tags (for Social Media Preview) -->
    <meta property="og:title" content="Portfolio | Joseph Prince">
    <meta property="og:description" content="A Full-Stack Developer specializing in modern web experiences.">
    <meta property="og:image" content="{% static 'images/preview.jpg' %}">
    <meta property="og:url" content="https://www.thejosephprince.com">
    <meta property="og:type" content="website">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Portfolio | Joseph Prince">
    <meta name="twitter:description" content="A Full-Stack Developer specializing in modern web experiences.">
    <meta name="twitter:image" content="{% static 'images/preview.jpg' %}">

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Joseph Prince",
      "url": "https://www.thejosephprince.com",
      "sameAs": [
        "https://twitter.com/yourhandle",
        "https://www.linkedin.com/in/yourprofile/",
        "https://github.com/yourgithub"
      ],
      "jobTitle": "Full-Stack Developer",
      "worksFor": {
        "@type": "Organization",
        "name": "Your Company"
      }
    }
    </script>

    <!-- Anime.js for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">

    <!-- Tailwind CSS -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">

    <title>Portfolio | Joseph Prince</title>
    {% block head %}{% endblock head %}

    <style>
        /* Ensure the video is properly positioned */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        #background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            opacity: 1; /* Ensure the video is fully visible */
        }

        /* Ensure overlay for better readability */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.05); /* Very light overlay */
            z-index: 0;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-white">
    <!-- Background Video -->
    <div id="video-container">
        <video id="background-video" autoplay loop muted playsinline>
            <source src="{% static 'videos/background.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Light Overlay for Readability -->
    <div id="video-overlay"></div>

    <!-- Navigation -->
    {% include "global/navigation.html" %}

    <!-- Main Content -->
    <main class="relative flex-grow z-10">
        {% block content %}{% endblock content %}
    </main>

    <!-- Footer -->
    {% include "global/footer.html" %}


    <!-- Page Load Fade-in Animation -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            anime({
                targets: "body",
                opacity: [0, 1],
                easing: "easeInOutQuad",
                duration: 1000
            });
        });
    </script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
