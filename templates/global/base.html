<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    {% load static %}

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                
                <!-- Logo -->
                <a href="{% url 'home' %}" class="text-2xl font-bold text-gray-800">MyPortfolio</a>

                <!-- Navigation Links -->
                <div class="hidden md:flex space-x-6">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-gray-900">Home</a>
                    <a href="{% url 'projects' %}" class="text-gray-600 hover:text-gray-900">Projects</a>
                    <a href="{% url 'blog' %}" class="text-gray-600 hover:text-gray-900">Blog</a>
                    <a href="{% url 'about' %}" class="text-gray-600 hover:text-gray-900">About</a>
                    {% if user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="text-gray-600 hover:text-gray-900">Logout</a>
                    {% else %}
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-gray-900">Login</a>
                    {% endif %}
                    <a href="{% url 'contact' %}" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition">Contact</a>

                </div>

                <!-- Mobile Menu Button -->
                <button id="mobile-menu-button" class="md:hidden text-gray-800 focus:outline-none">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden flex flex-col space-y-2 p-4">
            <a href="{% url 'home' %}" class="text-gray-600 hover:text-gray-900">Home</a>
            <a href="{% url 'projects' %}" class="text-gray-600 hover:text-gray-900">Projects</a>
            <a href="{% url 'blog' %}" class="text-gray-600 hover:text-gray-900">Blog</a>
            <a href="{% url 'about' %}" class="text-gray-600 hover:text-gray-900">About</a>
            <a href="{% url 'contact' %}" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-10">
        <p>&copy; 2025 My Portfolio. All rights reserved.</p>
    </footer>

    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });
    </script>

</body>
</html>
