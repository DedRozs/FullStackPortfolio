<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FullStack Portfolio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'portfolio/styles.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">FullStack Portfolio</a>
        <div class="ms-auto">
            <span id="user-info" class="text-white me-3"></span>
            {% if request.user.role == 'admin' %}
            <a id="admin-dashboard-link" class="btn btn-warning d-none" href="/admin/dashboard/">Admin Dashboard</a>
            {% endif %}
            <a id="auth-button" class="btn btn-outline-light" href="/login/">Login</a>
        </div>
    </nav>
  
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const authButton = document.getElementById("auth-button");
            const userInfo = document.getElementById("user-info");
            const adminDashboardLink = document.getElementById("admin-dashboard-link");
        
            const token = localStorage.getItem("authToken");
        
            if (token) {
                fetch("/api/auth/me/", {
                    method: "GET",
                    headers: { "Authorization": "Token " + token }
                })
                .then(response => response.json())
                .then(user => {
                    userInfo.textContent = `Logged in as: ${user.username}`;
                    authButton.textContent = "Logout";
                    authButton.href = "#";
                    authButton.addEventListener("click", function () {
                        localStorage.removeItem("authToken");
                        window.location.reload();
                    });
        
                    if (user.role === "admin") {
                        adminDashboardLink.classList.remove("d-none");  // Show Admin Dashboard link for admins
                    }
                })
                .catch(error => console.error("Error fetching user profile:", error));
            }
        });
        </script>
</body>
</html>
