name: Production Deployment

on:
  push:
    branches:
      - main  # Runs deployment when code is pushed to `main`

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🏗 Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 📦 Install Dependencies (Cached)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

          - name: Authenticate with Google Cloud
          env:
            GCLOUD_SERVICE_KEY:  ${{ secrets.GCP_SA_KEY }}
          run: |
            echo "$GCLOUD_SERVICE_KEY" > key.json
            gcloud auth activate-service-account --key-file=key.json
            gcloud config set project ai-fullstack-portfolio
            export GOOGLE_APPLICATION_CREDENTIALS=$PWD/key.json  # Fixes auth issues

      - name: 📄 Generate Secure `app.yaml` from GitHub Secrets
        run: |
          cat <<EOF > app.yaml
          runtime: python312
          entrypoint: gunicorn -b :\$PORT core.wsgi

          instance_class: F2

          service: default
          service_account: ai-fullstack-portfolio@appspot.gserviceaccount.com

          env_variables:
            GAE_SERVICE_ACCOUNT: "ai-fullstack-portfolio@appspot.gserviceaccount.com"
            GOOGLE_APPLICATION_CREDENTIALS: "/workspace/key.json"
            DJANGO_SETTINGS_MODULE: "core.settings"
            DEBUG: "False"
            DB_NAME: "${{ secrets.DB_NAME }}"
            DB_USER: "${{ secrets.DB_USER }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            DB_HOST: "${{ secrets.DB_HOST }}"
            DB_PORT: "${{ secrets.DB_PORT }}"
            DATABASE_URL: "mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}"
            GS_BUCKET_NAME: "${{ secrets.GS_BUCKET_NAME }}"

          automatic_scaling:
            target_cpu_utilization: 0.65
            min_instances: 1
            max_instances: 5

          handlers:
            - url: /static
              static_files: static/*
              upload: static/*

            - url: /(.*)
              script: auto
          EOF

      - name: 🔑 Generate `key.json` for Google Cloud Authentication
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/key.json

      - name: 🚀 Deploy to Google App Engine (Auto-Retry)
        run: |
          gcloud app deploy app.yaml --quiet --version=production --promote || gcloud app deploy app.yaml --quiet --version=production --promote
