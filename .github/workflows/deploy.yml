name: Production Deployment

on:
  workflow_run:
    workflows: ["Production Pre-Deployment Tests"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: latest

      - name: Authenticate with Google Cloud
        env:
          GCLOUD_SERVICE_KEY:  ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCLOUD_SERVICE_KEY" > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project ai-fullstack-portfolio
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/key.json  # Fixes auth issues

      - name: Deploy to Google App Engine (Production)
        run: |
          gcloud app deploy app.yaml --quiet --version=production --promote
