name: Production Deployment

on:
  workflow_run:
    workflows: ["Production Pre-Deployment Tests"]
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ai-fullstack-portfolio

      - name: Enable Cloud Scheduler API
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project=ai-fullstack-portfolio

      - name: Generate Secure app.yaml from GitHub Secrets
        run: |
          cat <<EOF > app.yaml
          runtime: python314
          entrypoint: gunicorn -b :\$PORT core.wsgi

          instance_class: F2

          service: default
          service_account: ai-fullstack-portfolio@appspot.gserviceaccount.com

          env_variables:
            GAE_SERVICE_ACCOUNT: "ai-fullstack-portfolio@appspot.gserviceaccount.com"
            DJANGO_SETTINGS_MODULE: "core.settings"
            DEBUG: "False"
            ALLOWED_HOSTS: "ai-fullstack-portfolio.uc.r.appspot.com,www.thejosephprince.com"
            DB_NAME: "${{ secrets.DB_NAME }}"
            DB_USER: "${{ secrets.DB_USER }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            DB_HOST: "${{ secrets.DB_HOST }}"
            DB_PORT: "${{ secrets.DB_PORT }}"
            DATABASE_URL: "mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}"
            SECRET_KEY: "${{ secrets.SECRET_KEY }}"
            GS_BUCKET_NAME: "${{ secrets.GS_BUCKET_NAME }}"
            REST_API_ID: "${{ secrets.REST_API_ID }}"
            REST_API_SECRET: "${{ secrets.REST_API_SECRET }}"
            EMAIL_HOST_USER: "${{ secrets.EMAIL_HOST_USER }}"
            EMAIL_HOST_PASSWORD: "${{ secrets.EMAIL_HOST_PASSWORD }}"
            SMS_NOTIFICATION_NUMBER: "${{ secrets.SMS_NOTIFICATION_NUMBER }}"
            TWILIO_ACCOUNT_SID: "${{ secrets.TWILIO_ACCOUNT_SID }}"
            TWILIO_AUTH_TOKEN: "${{ secrets.TWILIO_AUTH_TOKEN }}"
            TWILIO_PHONE_NUMBER: "${{ secrets.TWILIO_PHONE_NUMBER }}"
            OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
            ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
            CONTACT_RECIPIENT_EMAIL: "${{ secrets.CONTACT_RECIPIENT_EMAIL }}"
          automatic_scaling:
            target_cpu_utilization: 0.65
            min_instances: 1
            max_instances: 5

          handlers:
            - url: /static
              static_dir: staticfiles

            - url: /(.*)
              script: auto
          EOF

      - name: Build Frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Collect Static Files
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GS_BUCKET_NAME: ${{ secrets.GS_BUCKET_NAME }}
        run: |
          python manage.py collectstatic --noinput

      - name: Run Database Migrations
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py migrate --noinput

      - name: Deploy Main App to Google App Engine
        run: |
          gcloud app deploy app.yaml --quiet --version=production --promote

