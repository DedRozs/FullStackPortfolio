name: Deploy to Google App Engine

on:
  push:
    branches:
      - main  # Deploy only when changes are pushed to main

jobs:
  deploy:
    name: Deploying to Google Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: GCloud Authenticate
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use GCloud CLI
        run: |
          gcloud info
      
      - name: Ensure static directory exists
        run: mkdir -p staticfiles

      - name: Gather Static Files
        run: |
          python manage.py collectstatic --noinput

      - name: Run Migrations
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: "core.settings"
        run: |
          echo "DEBUG: Database Host is $DB_HOST"
          python manage.py makemigrations
          python manage.py migrate

      - name: Generate app.yaml with secrets
        run: |
          echo "runtime: python312" > app.yaml
          echo "entrypoint: gunicorn -b :$PORT core.wsgi" >> app.yaml
          echo "instance_class: F2" >> app.yaml
          echo "service: default" >> app.yaml
          echo "env_variables:" >> app.yaml
          echo "  DB_NAME: '${{ secrets.DB_NAME }}'" >> app.yaml
          echo "  DB_USER: '${{ secrets.DB_USER }}'" >> app.yaml
          echo "  DB_PASSWORD: '${{ secrets.DB_PASSWORD }}'" >> app.yaml
          echo "  DB_HOST: '${{ secrets.DB_HOST }}'" >> app.yaml
          echo "  DB_PORT: '${{ secrets.DB_PORT }}'" >> app.yaml
          echo "  SECRET_KEY: '${{ secrets.SECRET_KEY }}'" >> app.yaml
          echo "  DJANGO_SETTINGS_MODULE: 'core.settings'" >> app.yaml
          echo "  DEBUG: 'False'" >> app.yaml
          echo "automatic_scaling:" >> app.yaml
          echo "  target_cpu_utilization: 0.65" >> app.yaml
          echo "  min_instances: 1" >> app.yaml
          echo "  max_instances: 5" >> app.yaml
          echo "handlers:" >> app.yaml
          echo "  - url: /static" >> app.yaml
          echo "    static_dir: staticfiles" >> app.yaml
          echo "  - url: /.*" >> app.yaml
          echo "    script: auto" >> app.yaml
      

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v2
        with:
          deliverables: app.yaml
          version: v1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
