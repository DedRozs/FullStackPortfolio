name: Production Deployment

on:
  workflow_run:
    workflows: ["Production Pre-Deployment Tests"]
    types:
      - completed

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ai-fullstack-portfolio

      - name: Enable Cloud Scheduler API
        run: |
          gcloud services enable cloudscheduler.googleapis.com --project=ai-fullstack-portfolio

      - name: Generate Secure app.yaml from GitHub Secrets
        run: |
          cat <<EOF > app.yaml
          runtime: python314
          entrypoint: daphne -b 0.0.0.0 -p \$PORT core.asgi:application

          instance_class: F2

          service: default
          service_account: ai-fullstack-portfolio@appspot.gserviceaccount.com

          env_variables:
            GAE_SERVICE_ACCOUNT: "ai-fullstack-portfolio@appspot.gserviceaccount.com"
            DJANGO_SETTINGS_MODULE: "core.settings"
            DEBUG: "False"
            ALLOWED_HOSTS: "ai-fullstack-portfolio.uc.r.appspot.com,www.thejosephprince.com,thejosephprince.com,portfolio.thejosephprince.com"
            DB_NAME: "${{ secrets.DB_NAME }}"
            DB_USER: "${{ secrets.DB_USER }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            DB_HOST: "${{ secrets.DB_HOST }}"
            DB_PORT: "${{ secrets.DB_PORT }}"
            DATABASE_URL: "mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}"
            SECRET_KEY: "${{ secrets.SECRET_KEY }}"
            GS_BUCKET_NAME: "${{ secrets.GS_BUCKET_NAME }}"
            REST_API_ID: "${{ secrets.REST_API_ID }}"
            REST_API_SECRET: "${{ secrets.REST_API_SECRET }}"
            EMAIL_HOST_USER: "${{ secrets.EMAIL_HOST_USER }}"
            EMAIL_HOST_PASSWORD: "${{ secrets.EMAIL_HOST_PASSWORD }}"
            SMS_NOTIFICATION_NUMBER: "${{ secrets.SMS_NOTIFICATION_NUMBER }}"
            TWILIO_ACCOUNT_SID: "${{ secrets.TWILIO_ACCOUNT_SID }}"
            TWILIO_AUTH_TOKEN: "${{ secrets.TWILIO_AUTH_TOKEN }}"
            TWILIO_PHONE_NUMBER: "${{ secrets.TWILIO_PHONE_NUMBER }}"
            OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
            ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
            CONTACT_RECIPIENT_EMAIL: "${{ secrets.CONTACT_RECIPIENT_EMAIL }}"
            SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}"
            REDIS_URL: "${{ secrets.REDIS_URL }}"
            IRON_PDF_KEY: "${{ secrets.IRON_PDF_KEY }}"
          automatic_scaling:
            target_cpu_utilization: 0.65
            min_instances: 1
            max_instances: 5

          handlers:
            - url: /(.*)
              script: auto
          EOF

      - name: Build Frontend
        env:
          VITE_STATIC_BASE: "https://storage.googleapis.com/${{ secrets.GS_BUCKET_NAME }}/static/react_app/"
        run: |
          cd frontend && npm ci && npm run build

      - name: Collect Static Files
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GS_BUCKET_NAME: ${{ secrets.GS_BUCKET_NAME }}
        run: |
          python manage.py collectstatic --noinput

      - name: Fix Static File Cache Headers
        run: |
          # Entry-point files have fixed names and change on every deploy.
          # Set no-cache so browsers always revalidate them instead of serving
          # a stale 1-hour (or longer) cached copy after a new deployment.
          gsutil setmeta -h "Cache-Control:no-cache" \
            "gs://${{ secrets.GS_BUCKET_NAME }}/static/react_app/index.js" \
            "gs://${{ secrets.GS_BUCKET_NAME }}/static/react_app/index.css"
          # Font and image assets are content-addressable (pinned npm versions).
          # Cache them for 1 year so repeat visitors pay no network cost.
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
            "gs://${{ secrets.GS_BUCKET_NAME }}/static/react_app/assets/**"

      - name: Run Database Migrations
        env:
          # settings.py resolves the database from DATABASE_URL only; without it
          # this step silently migrated a throwaway SQLite file on the runner and
          # reported success while production received nothing.
          DATABASE_URL: "mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          # Fail loudly if the runner cannot reach Cloud SQL, rather than
          # falling through to a migrate that appears to succeed.
          python - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          url = urlparse(os.environ["DATABASE_URL"])
          if not url.hostname:
              sys.exit("DATABASE_URL has no host; refusing to run migrations.")
          print(f"Migrating {url.scheme} database on port {url.port}.")
          PY
          python manage.py migrate --noinput

      - name: Deploy Main App to Google App Engine
        run: |
          gcloud app deploy app.yaml --quiet --version=production --promote

      - name: Generate worker.yaml from GitHub Secrets
        run: |
          cat <<EOF > worker.yaml
          runtime: python314
          entrypoint: python manage.py qcluster

          service: worker
          service_account: ai-fullstack-portfolio@appspot.gserviceaccount.com

          instance_class: B2
          basic_scaling:
            max_instances: 1
            idle_timeout: 10m

          env_variables:
            DJANGO_SETTINGS_MODULE: "core.settings"
            DEBUG: "False"
            DB_NAME: "${{ secrets.DB_NAME }}"
            DB_USER: "${{ secrets.DB_USER }}"
            DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
            DB_HOST: "${{ secrets.DB_HOST }}"
            DB_PORT: "${{ secrets.DB_PORT }}"
            DATABASE_URL: "mysql://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}"
            SECRET_KEY: "${{ secrets.SECRET_KEY }}"
            GS_BUCKET_NAME: "${{ secrets.GS_BUCKET_NAME }}"
            OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
            ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
            SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}"
            REDIS_URL: "${{ secrets.REDIS_URL }}"
            IRON_PDF_KEY: "${{ secrets.IRON_PDF_KEY }}"
          EOF

      - name: Deploy Worker to Google App Engine
        run: |
          gcloud app deploy worker.yaml --quiet --version=production --promote

