name: Deploy Django to Google App Engine (Production)

on:
  workflow_run:
    workflows: ["Run Tests Before Deployment"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Only deploy if tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: latest

      - name: Run Database Migrations
        run: python manage.py migrate

      - name: Collect Static Files
        run: python manage.py collectstatic --noinput

      - name: Deploy to Google App Engine (Production)
        run: |
          gcloud app deploy app.yaml \
            --quiet \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --version=production \
            --promote  # Automatically routes traffic to this version
