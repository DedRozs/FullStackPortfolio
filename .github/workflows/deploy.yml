name: Deploy to Google App Engine

on:
  push:
    branches:
      - main  # Deploy only when changes are pushed to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ai-fullstack-portfolio  # Your actual project ID

    - name: Gather Static Files
      run: |
          python manage.py collectstatic --noinput
    
    - name: Run Migrations
      run: |
          python manage.py makemigrations
          python manage.py migrate
  
    - name: Deploy to Google App Engine
      run: |
        gcloud app deploy --quiet --promote --stop-previous-version --no-cache

    - name: Delete replaced version
      run: |
        gcloud app versions list --format="value(id)" --filter="service=default AND traffic_split=0.0" | tail -n +2 | xargs -r gcloud app versions delete --quiet
    
    - name: Delete old versions
      run: |
        gcloud app versions list --format="value(id)" --filter="traffic_split=0.0" | tail -n +2 | xargs -r gcloud app versions delete --quiet
